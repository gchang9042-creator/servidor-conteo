<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel del cliente</title>
    <style>
        body { background-color: #1e2a38; font-family: Segoe UI, sans-serif; color: #ecf0f1; padding: 30px; margin: 0; }
        h1 { margin-bottom: 5px; }
        .contenedor { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px; align-items: flex-start; }
        .panel { background-color: #25384d; padding: 20px; border-radius: 8px; flex: 1; min-width: 320px; }
        input { padding: 8px; border-radius: 4px; border: none; margin-right: 8px; margin-bottom: 8px; }
        button { padding: 8px 16px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button.eliminar { background-color: #e74c3c; padding: 4px 10px; font-size: 12px; margin-left: 10px; }
        ul { list-style: none; padding: 0; }
        li { background-color: #0f1720; padding: 10px; margin-top: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .mensaje { font-size: 13px; color: #95a5a6; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>🚌 Bienvenido, {{ nombre_cliente }} <a href="/logout" style="font-size: 14px; color: #e74c3c;">(Cerrar sesión)</a></h1>

    <div class="contenedor">
        <div class="panel">
            <h3>Agregar vehículo</h3>
            <input type="text" id="caja_placa" placeholder="Placa">
            <button onclick="agregarVehiculo()">Agregar</button>
            <p class="mensaje" id="mensaje_estado"></p>

            <h3>Mis vehículos</h3>
            <ul id="lista_vehiculos"></ul>

            <h3>Cambiar contraseña</h3>
            <input type="password" id="caja_clave_nueva" placeholder="Nueva clave">
            <button onclick="cambiarClave()">Actualizar</button>
            <p class="mensaje" id="mensaje_clave"></p>
        </div>

        <div class="panel">
            <h3>Dashboard de conteo</h3>
            <div>
                <input type="text" id="filtro_fecha" placeholder="AAAA-MM-DD">
                <input type="text" id="filtro_desde" placeholder="Desde HH:MM:SS">
                <input type="text" id="filtro_hasta" placeholder="Hasta HH:MM:SS">
                <input type="text" id="filtro_placa" placeholder="Placa (vacío = todas)">
                <button onclick="buscarEventos()">Buscar</button>
            </div>

            <p><strong>Entradas:</strong> <span id="total_entradas">0</span> &nbsp; <strong>Salidas:</strong> <span id="total_salidas">0</span></p>

            <ul id="lista_eventos"></ul>
        </div>
    </div>

    <script>
        // ---------- SECCIÓN VEHÍCULOS ----------

        function cargarVehiculos() {
            fetch("/mis-vehiculos")
                .then(respuesta => respuesta.json())
                .then(datos => {
                    const lista = document.getElementById("lista_vehiculos");
                    lista.innerHTML = "";
                    datos.vehiculos.forEach(placa => {
                        const item = document.createElement("li");
                        item.innerHTML = placa + ' <button class="eliminar" onclick="eliminarVehiculo(\'' + placa + '\')">Eliminar</button>';
                        lista.appendChild(item);
                    });
                });
        }

        function agregarVehiculo() {
            const placa = document.getElementById("caja_placa").value.trim();
            if (placa === "") {
                return;
            }

            fetch("/mi-vehiculo", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ placa: placa })
            })
                .then(respuesta => respuesta.json())
                .then(datos => {
                    document.getElementById("mensaje_estado").innerText = datos.mensaje;
                    document.getElementById("caja_placa").value = "";
                    cargarVehiculos();
                });
        }

        function eliminarVehiculo(placa) {
            fetch("/mi-vehiculo", {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ placa: placa })
            })
                .then(respuesta => respuesta.json())
                .then(datos => {
                    document.getElementById("mensaje_estado").innerText = datos.mensaje;
                    cargarVehiculos();
                });
        }

        // ---------- SECCIÓN CUENTA ----------

        function cambiarClave() {
            const claveNueva = document.getElementById("caja_clave_nueva").value.trim();
            if (claveNueva === "") {
                return;
            }

            fetch("/cambiar-clave", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ clave_nueva: claveNueva })
            })
                .then(respuesta => respuesta.json())
                .then(datos => {
                    document.getElementById("mensaje_clave").innerText = datos.mensaje || datos.error;
                    document.getElementById("caja_clave_nueva").value = "";
                })
                .catch(error => {
                    document.getElementById("mensaje_clave").innerText = "Error de conexión: " + error;
                });
        }

        // ---------- SECCIÓN DASHBOARD ----------

        function buscarEventos() {
            const fecha = document.getElementById("filtro_fecha").value || new Date().toISOString().split("T")[0];
            const desde = document.getElementById("filtro_desde").value || "00:00:00";
            const hasta = document.getElementById("filtro_hasta").value || "23:59:59";
            const placaFiltro = document.getElementById("filtro_placa").value.trim().toUpperCase();

            fetch("/mis-eventos")
                .then(respuesta => respuesta.json())
                .then(datos => {
                    let totalEntradas = 0;
                    let totalSalidas = 0;
                    const lista = document.getElementById("lista_eventos");
                    lista.innerHTML = "";

                    datos.eventos.forEach(evento => {
                        const partes = evento.hora.split(" ");
                        const fechaEvento = partes[0];
                        const horaEvento = partes[1];

                        if (placaFiltro !== "" && evento.bus.toUpperCase() !== placaFiltro) {
                            return;
                        }

                        if (fechaEvento === fecha && horaEvento >= desde && horaEvento <= hasta) {
                            const icono = evento.tipo === "entrada" ? "🟢" : "🔴";
                            const item = document.createElement("li");
                            item.innerText = icono + " " + evento.bus + "  " + horaEvento + "  " + evento.tipo;
                            lista.appendChild(item);

                            if (evento.tipo === "entrada") {
                                totalEntradas++;
                            } else {
                                totalSalidas++;
                            }
                        }
                    });

                    document.getElementById("total_entradas").innerText = totalEntradas;
                    document.getElementById("total_salidas").innerText = totalSalidas;
                });
        }

        // ---------- INICIO ----------

        document.getElementById("filtro_fecha").value = new Date().toISOString().split("T")[0];
        cargarVehiculos();
        buscarEventos();
    </script>
</body>
</html>
